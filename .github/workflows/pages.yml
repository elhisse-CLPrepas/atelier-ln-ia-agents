name: Publier l’atelier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Lire la configuration Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Vérifier et compiler le site
        run: npm run check
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Contrôler le dossier publié
        run: node scripts/controler-publication.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Préparer le contenu de dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
